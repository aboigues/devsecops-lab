# Pipeline DevSecOps de référence : chaque contrôle de sécurité est un job bloquant,
# placé le plus tôt possible (shift-left). Ordre : code -> dépendances -> IaC -> image -> exécution.
#
#   test ──> sast / secrets / sca / iac ──> image ──> scan image ──> dast ──> gitops:propose (MR) ──> fusion humaine ──> Argo CD
#
# Toutes les images d'outils sont épinglées : un pipeline de sécurité ne doit pas changer sans revue.

stages: [test, analyse, package, verify, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: .trivycache
  # Seuil de blocage : vulnérabilités HIGH/CRITICAL ayant un correctif disponible
  TRIVY_SEVERITY: HIGH,CRITICAL
  TRIVY_IGNORE_UNFIXED: "true"
  # Sans cette variable, les modèles SAST et Secret Detection (GitLab 17+) ne tournent PAS dans les
  # pipelines de merge request : aucune analyse de sécurité sur les MR, sans aucun message.
  AST_ENABLE_MR_PIPELINES: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Analyseurs GitLab (disponibles en édition CE : SAST Semgrep et détection de secrets).
# En CE les rapports sont téléchargeables en artefact ; la vue consolidée est une fonction Ultimate.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

sast:
  stage: analyse

secret_detection:
  stage: analyse
  variables:
    # Historique complet sur MR : un secret supprimé dans un commit ultérieur reste compromis
    SECRET_DETECTION_HISTORIC_SCAN: "true"

.trivy:
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  cache:
    key: trivy
    paths: [.trivycache/]

# --- 1. Tests : pyramide unitaires / web / intégration + couverture minimale --------------
unit-and-integration:
  stage: test
  image: maven:3.9.16-eclipse-temurin-25
  cache:
    key: maven
    paths: [.m2/]
  script:
    - cd app && mvn -B verify
  artifacts:
    when: always
    # Le JAR livré : c'est lui que le job de SCA analyse (hors ligne, sans interroger Maven Central)
    paths: [app/target/bank-api-*.jar]
    reports:
      junit:
        - app/target/surefire-reports/TEST-*.xml
        - app/target/failsafe-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: app/target/site/jacoco/jacoco.xml

# --- 2. Analyse des dépendances (SCA) et nomenclature logicielle (SBOM) -------------------
dependencies:
  extends: .trivy
  stage: analyse
  needs: [unit-and-integration]
  # On analyse le JAR réellement livré, identifié HORS LIGNE : « trivy fs » sur le pom.xml interroge
  # Maven Central, qui répond 429 et bloque l'IP du runner 30 min (constaté en lab, journal 2026-09-26).
  script:
    - trivy rootfs --offline-scan --scanners vuln --exit-code 1 app/target/bank-api-0.0.1-SNAPSHOT.jar
    - trivy rootfs --offline-scan --format cyclonedx --output sbom.cdx.json app/target/bank-api-0.0.1-SNAPSHOT.jar
  artifacts:
    when: always
    paths: [sbom.cdx.json]
    reports:
      cyclonedx: sbom.cdx.json

# --- 3. Infrastructure as Code : Terraform et manifestes rendus ---------------------------
iac:
  extends: .trivy
  stage: analyse
  before_script:
    - wget -qO- https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz | tar xz -C /usr/local/bin
  script:
    - trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL terraform/
    - trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL app/   # Dockerfile
    # On scanne ce qui sera réellement appliqué (overlays rendus), pas la base incomplète
    - mkdir -p rendered
    - kustomize build gitops/overlays/lab > rendered/lab.yaml
    - kustomize build gitops/overlays/openshift > rendered/openshift.yaml
    - trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL rendered/

# --- 4. Construction de l'image, sans privilège (Buildah rootless, pas de Docker-in-Docker)
build-image:
  stage: package
  # Runner dédié : Buildah a besoin d'espaces de noms utilisateur, que les profils seccomp et AppArmor
  # par défaut de Docker interdisent. Seul ce runner les lève (toujours sans --privileged) ; tous les
  # autres jobs, dont le code des apprenants, gardent les profils par défaut (journal 2026-09-26).
  tags: [buildah]
  image: quay.io/buildah/stable:v1.43.4
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah build --layers -t "$IMAGE" app/
    - buildah push "$IMAGE"

# --- 5. Scan de l'image construite (OS + JRE + dépendances embarquées) --------------------
container-scan:
  extends: .trivy
  stage: verify
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 "$IMAGE"

# --- 6. DAST : l'application tourne réellement, ZAP l'attaque en boîte noire --------------
dast:
  stage: verify
  image: zaproxy/zap-stable:2.17.0
  services:
    - name: $IMAGE
      alias: bank-api
  script:
    - mkdir -p /zap/wrk && cp .zap/baseline.conf /zap/wrk/
    - until curl -fsS http://bank-api:8080/actuator/health/readiness; do sleep 3; done
    # Échec sur toute alerte de niveau WARN ou FAIL (pas d'option -I) ; exceptions justifiées dans .zap/
    - zap-baseline.py -t http://bank-api:8080/api/accounts -c baseline.conf -r zap-report.html -J zap-report.json
  after_script:
    - cp /zap/wrk/zap-report.* "$CI_PROJECT_DIR/" || true
  artifacts:
    when: always
    paths: [zap-report.html, zap-report.json]

# --- 7. GitOps : la CI ne déploie jamais, elle PROPOSE le nouvel état désiré ----------------
# Le bot pousse une branche `gitops/<sha>` et ouvre une merge request (options de push GitLab).
# Un humain relit et fusionne ; Argo CD (pull) synchronise alors le cluster.
# Aucun identifiant cluster dans la CI, aucun push direct sur `main` (branche protégée « no one »).
gitops:propose:
  stage: deploy
  image:
    name: alpine/git:2.54.0
    entrypoint: [""]
  rules:
    # Uniquement quand le code applicatif change : la fusion d'une MR GitOps ne relance pas de proposition
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [app/**/*]
  before_script:
    - wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 && chmod +x /usr/local/bin/yq
  script:
    - yq -i '.images[0].newName = strenv(CI_REGISTRY_IMAGE) | .images[0].newTag = strenv(CI_COMMIT_SHORT_SHA)' gitops/overlays/lab/kustomization.yaml
    - git config user.name "gitops-bot" && git config user.email "gitops-bot@noreply.invalid"
    - git checkout -b "gitops/$CI_COMMIT_SHORT_SHA"
    # Entre apostrophes : « chore(gitops): » ferait lire la ligne comme une clé YAML, pas comme une commande
    - 'git commit -am "chore(gitops): bank-api $CI_COMMIT_SHORT_SHA"'
    - >
      git push "https://gitops-bot:${GITOPS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/gitops/$CI_COMMIT_SHORT_SHA"
      -o merge_request.create
      -o merge_request.target="$CI_DEFAULT_BRANCH"
      -o merge_request.remove_source_branch
      -o merge_request.title="Déployer bank-api $CI_COMMIT_SHORT_SHA en lab"
      -o merge_request.description="Image scannée (SCA, image, DAST) par le pipeline $CI_PIPELINE_URL"
  environment:
    name: lab
    action: prepare
