apiVersion: apps/v1
kind: Deployment
metadata:
  name: soldes
  namespace: soldes
  labels:
    app.kubernetes.io/name: soldes
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: soldes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soldes
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soldes
          image: ghcr.io/neobanque-exemple/soldes:1.0.0
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
