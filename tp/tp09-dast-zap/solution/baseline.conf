# Configuration ZAP baseline : une règle par ligne, « <id>	<IGNORE|INFO|WARN|FAIL>	(<nom>) » (tabulations).
# Sans ligne pour une règle, ZAP applique son niveau par défaut (WARN) : toute alerte fait échouer la gate.
#
# 10049 Non-Storable Content - 2026-09-25 : ZAP signale que les réponses ne peuvent pas être mises en
# cache. C'est le comportement voulu pour des soldes bancaires (Cache-Control: no-store, OWASP ASVS
# V8.2.1). Rétrogradée en INFO et non IGNORE : elle reste visible dans le rapport. À revoir si l'API
# sert un jour du contenu public cacheable.
10049	INFO	(Non-Storable Content)
