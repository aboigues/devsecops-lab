apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  labels:
    app.kubernetes.io/name: bank-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bank-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bank-api
    spec:
      automountServiceAccountToken: false
      # Pas de runAsUser figé : OpenShift attribue un UID arbitraire, Kubernetes utilise celui de l'image (10001)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bank-api
          image: bank-api
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Système de fichiers en lecture seule : seul /tmp (Tomcat) est inscriptible
        - name: tmp
          emptyDir: {}
