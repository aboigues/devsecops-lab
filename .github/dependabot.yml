# Mises à jour proposées par PR (jamais fusionnées automatiquement : un humain relit chaque montée
# de version, la CI rejoue toutes les gates). Regroupées pour limiter le bruit.
# Délai de carence de 7 jours : une version fraîchement publiée (éventuellement compromise, cf. attaques
# sur la chaîne d'approvisionnement npm/PyPI) n'est pas proposée tout de suite. Les correctifs de
# sécurité Dependabot ne sont pas concernés par ce délai.
version: 2
updates:
  - package-ecosystem: maven
    directory: /app
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      maven: { patterns: ["*"] }
  # Travaux pratiques : les versions des énoncés restent à jour comme celles de l'application
  - package-ecosystem: maven
    directories: [/tp/tp01-tests-couverture/starter, /tp/tp01-tests-couverture/solution, /tp/tp04-sca-sbom/projet]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      tp-maven: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
  # Images de l'application et des solutions de TP (le starter du TP05 reste volontairement sur « latest »)
  - package-ecosystem: docker
    directories: [/app, /tp/tp05-image-durcie/solution, /tp/tp09-dast-zap/starter, /tp/tp09-dast-zap/solution]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # Dependabot interprète mal les tags composés (« 3.9.16-eclipse-temurin-25 ») : il a proposé
    # « 3-eclipse-temurin-24 », soit un JDK plus ancien et un tag flottant (journal, 2026-09-23).
    # On ne garde que les mises à jour de digest ; tout changement de tag se fait à la main,
    # après vérification de la dernière version stable.
    # Les deux formes de nom sont nécessaires : Dependabot nomme « library/maven » une image écrite
    # « docker.io/library/maven », et la règle sur « maven » seul ne s'appliquait pas (PR #15, journal 2026-10-15).
    ignore:
      - dependency-name: maven
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: library/maven
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: library/eclipse-temurin
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
  - package-ecosystem: terraform
    directories: [/terraform/bootstrap, /terraform/platform, /terraform/labs]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      terraform: { patterns: ["*"] }
