# SAST : CodeQL analyse le code Java (flux de données : injection, désérialisation, SSRF...)
# et les workflows GitHub Actions eux-mêmes. Toute alerte de sévérité élevée bloque la PR
# via la règle « code scanning » de la protection de `main`.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hebdomadaire : de nouvelles requêtes peuvent révéler un défaut dans du code inchangé
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
