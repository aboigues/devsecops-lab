# CI du dépôt public : tests Java + contrôles IaC/manifestes + secrets.
# Le pipeline complet (image, DAST, GitOps) s'exécute sur le GitLab auto-hébergé du lab.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify
        working-directory: app

  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/
      - name: terraform validate
        run: |
          for d in bootstrap platform labs; do
            terraform -chdir=terraform/$d init -backend=false -input=false
            terraform -chdir=terraform/$d validate
          done
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"
        working-directory: terraform
      - name: Rendu des overlays
        run: |
          mkdir -p rendered
          kustomize build gitops/overlays/lab > rendered/lab.yaml
          kustomize build gitops/overlays/openshift > rendered/openshift.yaml
      - name: Trivy config (Terraform + manifestes rendus)
        run: |
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:0.74.0 config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL terraform/
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:0.74.0 config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL rendered/

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --exit-code 1
