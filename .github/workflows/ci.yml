# CI du dépôt public : chaque job est une gate de sécurité bloquante, exigée par la règle de
# protection de `main` (aucune fusion sans que tous ces contrôles soient verts).
#
#   secrets ─┐
#   workflows┤
#   app ─────┼─> (SCA + SBOM sur le JAR)
#   iac ─────┤
#   container┴─> image ─> scan image ─> DAST (ZAP contre l'application réellement démarrée)
#   dependency-review (PR uniquement) ; SAST CodeQL dans codeql.yml
#
# Durcissement de la chaîne elle-même : actions épinglées par SHA de commit, images d'outils épinglées
# par digest, jeton GITHUB_TOKEN en lecture seule, identifiants git non conservés après le checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  GITLEAKS: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ZAP: zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

jobs:
  # --- Gate 1 : tests (pyramide + couverture >= 80 %), puis SCA et SBOM sur l'artefact livré ------
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify
        working-directory: app
      # On scanne le JAR construit (dépendances réellement embarquées), hors ligne :
      # pas de résolution Maven Central, donc pas de faux vert en cas de limite de débit.
      - name: SCA (HIGH/CRITICAL corrigeables = échec)
        run: |
          docker run --rm -v "$PWD/app/target:/t" "$TRIVY" rootfs --offline-scan --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /t/bank-api-0.0.1-SNAPSHOT.jar
      - name: SBOM CycloneDX
        run: |
          docker run --rm -v "$PWD/app/target:/t" "$TRIVY" rootfs --offline-scan \
            --format cyclonedx --output /t/sbom.cdx.json /t/bank-api-0.0.1-SNAPSHOT.jar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: app-reports
          path: |
            app/target/sbom.cdx.json
            app/target/site/jacoco/
            app/target/surefire-reports/
            app/target/failsafe-reports/

  # --- Gate 2 : image, scan d'image, DAST ------------------------------------------------------
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construction de l'image
        run: docker build -t bank-api:ci app/
      - name: Scan d'image (OS + JRE + dépendances ; HIGH/CRITICAL corrigeables = échec)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 bank-api:ci
      - name: Démarrage de l'application (utilisateur non-root, système de fichiers en lecture seule)
        run: |
          docker run -d --name bank-api --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 bank-api:ci
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health/readiness; do sleep 3; done'
      # Toute alerte WARN ou FAIL fait échouer le job (pas d'option -I) ; exceptions justifiées dans .zap/
      - name: DAST (ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap && cp .zap/baseline.conf zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" "$ZAP" \
            zap-baseline.py -t http://localhost:8080/api/accounts -c baseline.conf -r zap-report.html -J zap-report.json
      - name: Journaux de l'application
        if: always()
        run: docker logs bank-api || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dast-report
          path: zap/

  # --- Gate 3 : Infrastructure as Code (Terraform, manifestes rendus, Dockerfile) ----------------
  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/
      - name: terraform validate
        run: |
          for d in bootstrap platform labs; do
            terraform -chdir=terraform/$d init -backend=false -input=false
            terraform -chdir=terraform/$d validate
          done
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"
        working-directory: terraform
      - name: Rendu des overlays
        run: |
          mkdir -p rendered
          kustomize build gitops/overlays/lab > rendered/lab.yaml
          kustomize build gitops/overlays/openshift > rendered/openshift.yaml
      # On scanne ce qui sera réellement appliqué : overlays rendus, pas la base incomplète
      - name: Trivy config (Terraform, manifestes rendus, Dockerfile)
        run: |
          for target in terraform/ rendered/ app/; do
            docker run --rm -v "$PWD:/w" -w /w "$TRIVY" config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL "$target"
          done

  # --- Gate 4 : secrets, sur tout l'historique (un secret supprimé reste compromis) --------------
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo --redact --exit-code 1

  # --- Gate 5 : sécurité de la CI elle-même (injection de script, permissions, épinglage) --------
  workflows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  # --- Gate 6 : revue des dépendances introduites par la PR (vulnérabilités et licences) ---------
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
