spring.application.name=bank-api
server.port=8080
# Arrêt propre pour les rolling updates Kubernetes / OpenShift
server.shutdown=graceful
# Surface d'exposition minimale : uniquement les sondes de santé
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Ne jamais divulguer les détails d'erreur internes au client
server.error.include-stacktrace=never
server.error.include-message=never
